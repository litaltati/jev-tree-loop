[project]
name = "parser_agent"
version = "0.1.0"
description = "Parser Agent: Excel -> SheetCompressor -> LLM schema -> SQLite, run as a CrewAI Flow"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai==1.15.10",
    "aspose-cells-python>=26.9.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12",
    "openai>=2.0",
    "typer>=0.25",
    "python-dotenv>=1.2",
    "fastapi>=0.139",
    "uvicorn>=0.49",
    "qdrant-client>=1.19",
    "langfuse>=4.15.6",
    "typesafe-sdk==0.7.2",
]

[project.scripts]
parser_agent = "parser_agent.cli:main"
kickoff = "parser_agent.main:kickoff"
run_crew = "parser_agent.main:kickoff"
plot = "parser_agent.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_agent"]

[tool.crewai]
type = "flow"
