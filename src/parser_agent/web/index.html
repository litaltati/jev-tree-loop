<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parser Agent — chat</title>
<style>
:root{
  --bg:#0a0809;
  --panel:rgba(255,255,255,.035);
  --panel-2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.075);
  --line-soft:rgba(255,255,255,.045);
  --text:#f3eff6;
  --muted:#9a92a4;
  --muted-2:#6f6878;
  --accent:#e3b8f5;
  --accent-2:#a78bfa;
  --good:#5ee79b;
  --radius:20px;
  --side-w:248px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(900px 500px at 12% -5%, rgba(167,139,250,.18), transparent 60%),
    radial-gradient(700px 500px at 92% 105%, rgba(227,184,245,.13), transparent 60%),
    var(--bg);
  color:var(--text);
  font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:22px;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{flex:none}

/* ---------- frame: the sidebar folds into a rail of icons ---------- */
.shell{
  display:grid; grid-template-columns:var(--side-w) minmax(0,1fr); gap:20px;
  max-width:1460px; margin:0 auto; height:calc(100vh - 44px);
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border:1px solid var(--line); border-radius:28px; padding:18px;
  box-shadow:0 40px 120px rgba(0,0,0,.55);
  transition:grid-template-columns .2s ease;
}
.shell.collapsed{--side-w:64px}
.side{
  background:rgba(10,8,11,.55); border:1px solid var(--line-soft);
  border-radius:var(--radius); padding:14px 12px; display:flex; flex-direction:column;
  min-width:0; min-height:0;
}
.side-top{display:flex;align-items:center;gap:6px;margin-bottom:18px;position:relative}
.collapsed .side-top{flex-direction:column}
.icon-btn{
  height:34px;min-width:34px;padding:0 8px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);background:var(--panel);border:1px solid var(--line-soft);transition:.16s;font-size:12px;font-weight:600;
}
.icon-btn:hover{color:var(--text);background:var(--panel-2);border-color:rgba(227,184,245,.22)}
.icon-btn.toggle{margin-right:auto}
.collapsed .icon-btn.toggle{margin-right:0}

.lang-menu{
  position:absolute;top:40px;left:0;z-index:20;min-width:170px;padding:6px;border-radius:14px;
  background:#17121b;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.collapsed .lang-menu{left:44px;top:auto;bottom:0}
.lang-menu button{
  display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px;border-radius:9px;
  color:var(--muted);font-size:13px;text-align:left;
}
.lang-menu button:hover{background:var(--panel-2);color:var(--text)}
.lang-menu button.on{color:var(--text)}
.lang-menu button.on::after{content:"✓";color:var(--accent)}

.nav{display:flex;flex-direction:column;gap:4px}
.nav button{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
  color:var(--muted); text-align:left; width:100%; transition:.18s;
}
.nav button.on{
  color:var(--text);
  background:linear-gradient(90deg, rgba(227,184,245,.22), rgba(167,139,250,.07));
  box-shadow:inset 0 0 0 1px rgba(227,184,245,.16), -12px 0 26px -18px var(--accent);
}
.collapsed .nav button{justify-content:center;padding:11px 0}
.nav .ic{width:16px;height:16px;opacity:.85}

/* ---------- saved chats ---------- */
.chats{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px}
.chats h4{margin:14px 8px 6px;font-size:10.5px;font-weight:600;color:var(--muted-2);text-transform:uppercase;letter-spacing:.7px}
.chats h4:first-child{margin-top:4px}
.chat-item{display:flex;align-items:center;gap:4px;width:100%;padding:7px 6px 7px 10px;border-radius:11px;color:var(--muted);font-size:13px;cursor:pointer}
.chat-item:hover{background:var(--panel);color:var(--text)}
.chat-item.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px rgba(227,184,245,.16)}
.chat-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .act{display:none;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;color:var(--muted-2)}
.chat-item:hover .act,.chat-item.on .act{display:inline-flex}
.chat-item .act:hover{color:var(--text);background:rgba(255,255,255,.07)}
.no-chats{margin:6px 8px;color:var(--muted-2);font-size:12.5px}
.collapsed .chats{visibility:hidden}

/* ---------- who is signed in ---------- */
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 4px 0;border-top:1px solid var(--line-soft)}
.me .me-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me .me-name b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .me-name small{color:var(--muted-2);font-size:11.5px}
.collapsed .me{flex-direction:column;padding-left:0;padding-right:0}
.collapsed .label{display:none}

.ava{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:linear-gradient(140deg, rgba(227,184,245,.3), rgba(167,139,250,.18)); color:var(--accent)}

/* ---------- main: the chat takes the whole height ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid var(--line-soft); border-radius:var(--radius); padding:20px; min-width:0;
}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-weight:500;color:var(--muted-2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  padding:0 12px 10px;border-bottom:1px solid var(--line-soft);
}
td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.022)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.err{color:#f0a6b1}
.chart{display:block;max-width:100%;margin:10px 0 4px;border-radius:12px;background:#fff}
.hide{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:8px}

.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chatbar{display:flex;align-items:center;margin-bottom:10px;min-height:20px}
.summary{color:var(--muted-2);font-size:12.5px}
.feed{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:4px 2px 16px}
.msg{display:flex;gap:12px;max-width:min(880px,100%)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .who{
  width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:linear-gradient(140deg, rgba(227,184,245,.3), rgba(167,139,250,.18));color:var(--accent);
}
.msg.me .who{background:var(--panel-2);color:var(--muted)}
.bubble{
  background:rgba(255,255,255,.045);border:1px solid var(--line-soft);border-radius:16px;
  padding:13px 16px;min-width:0;overflow-wrap:anywhere;
}
.msg.me .bubble{background:linear-gradient(120deg, rgba(227,184,245,.2), rgba(167,139,250,.09));border-color:rgba(227,184,245,.2)}
.bubble p{margin:0;white-space:pre-wrap}
.sqlbox{margin-top:12px;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.sqlbox summary{padding:8px 12px;cursor:pointer;font-size:11.5px;color:var(--muted-2);list-style:none}
.sqlbox summary::-webkit-details-marker{display:none}
.sqlbox summary:hover{color:var(--text)}
.sqlbox pre{margin:0;padding:12px;background:rgba(10,8,11,.6);overflow:auto;font-size:11.5px;color:#dcd2e6}
.res{margin-top:12px;border:1px solid var(--line-soft);border-radius:12px;overflow:auto;max-height:280px}
.res table{font-size:11.5px}
.res th,.res td{padding:8px 12px;white-space:nowrap}
/* The answer text: Markdown from the model, rendered as a safe subset. */
.md{display:flex;flex-direction:column;gap:10px}
.md p{margin:0;white-space:normal}
.md ul,.md ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.md code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.06)}
.md .res{margin-top:2px}
/* Who answered: the Jev tree or the agents (this copy compares the two). */
.engine{display:inline-block;margin-top:12px;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-soft);color:var(--muted-2)}
.engine.tree,.engine.loop{color:#4fcfd8;border-color:rgba(79,207,216,.35)}
.ask{
  display:flex;gap:12px;align-items:flex-end;padding:12px 14px;border-radius:18px;
  background:var(--panel);border:1px solid var(--line-soft);
}
.ask:focus-within{border-color:rgba(227,184,245,.3);box-shadow:0 0 0 3px rgba(227,184,245,.07)}
.ask textarea{flex:1;border:0;background:none;outline:none;resize:none;max-height:140px;line-height:1.5;padding:4px 0}
.ask textarea::placeholder{color:var(--muted-2)}
.send{
  width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(120deg, rgba(227,184,245,.9), rgba(167,139,250,.8));color:#1a1220;
}
.send:disabled{opacity:.4;cursor:default}
/* The steps of an answer while it is being made. */
.steps{list-style:none;margin:0;padding:2px 0;display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.steps li.running{color:var(--text)}
.steps .ico{width:16px;height:16px;flex:none;display:grid;place-items:center}
.steps .done .ico{color:var(--good)}
.steps .failed .ico{color:#f0a6b1}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(227,184,245,.22);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:1080px){
  .shell{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 44px)}
  .side{flex-direction:row;align-items:center;gap:12px;overflow:visible}
  .side-top{margin-bottom:0}
  .nav{flex-direction:row}
  .me{margin-top:0;margin-left:auto;border-top:0;padding-top:0}
  .icon-btn.toggle{display:none}
  .chats{display:none}
  .chat{height:calc(100vh - 190px)}
}
</style>
</head>
<body>
<div class="shell" id="shell">

  <aside class="side">
    <div class="side-top">
      <button class="icon-btn toggle" id="toggle" data-i18n-title="toggle_sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button class="icon-btn" id="newchat" data-i18n-title="new_chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="icon-btn" id="lang" data-i18n-title="language" aria-haspopup="menu">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span id="lang-code">EN</span>
      </button>
      <div class="lang-menu hide" id="lang-menu" role="menu">
        <button data-lang="en" role="menuitemradio">English</button>
        <button data-lang="az" role="menuitemradio">Azərbaycanca</button>
        <button data-lang="ru" role="menuitemradio">Русский</button>
      </div>
    </div>

    <div class="chats" id="chats"></div>

    <div class="me">
      <span class="ava" id="me-ava">?</span>
      <span class="me-name label"><b id="me-name">—</b><small data-i18n="signed_in">signed in</small></span>
      <button class="icon-btn" id="logout" data-i18n-title="sign_out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
        <span class="label" data-i18n="sign_out">Sign out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <section class="card chat">
      <div class="chatbar"><span class="summary" id="summary"></span></div>
      <div class="feed" id="feed"></div>
      <div class="ask">
        <textarea id="q" rows="1" data-i18n-placeholder="placeholder"></textarea>
        <button class="send" id="send" data-i18n-title="send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = (s, n = 46) => (s = String(s ?? ""), s.length > n ? s.slice(0, n - 1) + "…" : s);
const initials = (s) => String(s || "?").replace(/[^\wа-яА-Я]+/g, " ").trim().split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();

/* Per-browser preferences: the interface language and the folded sidebar.
   Storage can be blocked (a private window) — then the defaults apply. */
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- interface language ---------- */
const I18N = {
  en: {
    chats: "Chats", today: "Today", yesterday: "Yesterday", week: "Previous 7 days", earlier: "Earlier", no_chats: "No chats yet", rename: "Rename", delete: "Delete", rename_prompt: "New name for the chat:", delete_confirm: "Delete this chat? This cannot be undone.",
    chat: "Chat", new_chat: "New chat", language: "Interface language", toggle_sidebar: "Collapse or expand the sidebar",
    signed_in: "signed in", sign_out: "Sign out", send: "Send", me: "Me",
    placeholder: "Ask about the data: revenue by item…",
    greeting: "Hi! I'm DWH AI Agent. I can help with data queries, analytics questions, comparisons, and metric definitions. What would you like to explore?",
    updated: "updated {date}", first_rows: "…first 50 of {n} shown", load_failed: "Could not load the catalog:",
    step_question: "Understanding the question", step_data: "Finding the data", step_chart: "Building the chart", step_answer: "Preparing the answer",
    stream_cut: "The connection was lost. The answer will appear in this chat's history once it is ready.",
    engine_tree: "Figures found by the Jev tree", engine_loop: "Answered by the Jev loop", engine_crew: "Answered by the agents",
  },
  az: {
    chats: "Söhbətlər", today: "Bu gün", yesterday: "Dünən", week: "Son 7 gün", earlier: "Daha əvvəl", no_chats: "Hələ söhbət yoxdur", rename: "Adını dəyiş", delete: "Sil", rename_prompt: "Söhbətin yeni adı:", delete_confirm: "Bu söhbət silinsin? Bunu geri qaytarmaq olmaz.",
    chat: "Söhbət", new_chat: "Yeni söhbət", language: "İnterfeys dili", toggle_sidebar: "Paneli yığ və ya aç",
    signed_in: "daxil olub", sign_out: "Çıxış", send: "Göndər", me: "Mən",
    placeholder: "Məlumatlar haqqında soruşun: maddələr üzrə gəlir…",
    greeting: "Salam! Mən DWH AI Agentəm. Məlumat sorğuları, analitik suallar, müqayisələr və metriklərin tərifləri ilə kömək edə bilərəm. Nəyi araşdırmaq istərdiniz?",
    updated: "yeniləndi: {date}", first_rows: "…{n} sətirdən ilk 50-si göstərilir", load_failed: "Kataloqu yükləmək mümkün olmadı:",
    step_question: "Sualı təhlil edirəm", step_data: "Lazımi məlumatları tapıram", step_chart: "Qrafik qururam", step_answer: "Cavabı hazırlayıram",
    stream_cut: "Bağlantı kəsildi. Cavab hazır olanda bu söhbətin tarixçəsində görünəcək.",
    engine_tree: "Rəqəmləri Jev ağacı tapdı", engine_loop: "Jev dövrü cavab verdi", engine_crew: "Agentlər cavab verdi",
  },
  ru: {
    chats: "Чаты", today: "Сегодня", yesterday: "Вчера", week: "Последние 7 дней", earlier: "Ранее", no_chats: "Чатов пока нет", rename: "Переименовать", delete: "Удалить", rename_prompt: "Новое название чата:", delete_confirm: "Удалить этот чат? Это нельзя отменить.",
    chat: "Чат", new_chat: "Новый чат", language: "Язык интерфейса", toggle_sidebar: "Свернуть или развернуть панель",
    signed_in: "в системе", sign_out: "Выйти", send: "Отправить", me: "Я",
    placeholder: "Спросите о данных: выручка по статьям…",
    greeting: "Привет! Я DWH AI Agent. Помогу с запросами к данным, аналитическими вопросами, сравнениями и определениями метрик. Что хотите изучить?",
    updated: "обновлено {date}", first_rows: "…показаны первые 50 из {n}", load_failed: "Не удалось загрузить каталог:",
    step_question: "Разбираю вопрос", step_data: "Ищу нужные данные", step_chart: "Строю график", step_answer: "Готовлю ответ",
    stream_cut: "Связь прервалась. Ответ появится в истории этого чата, когда будет готов.",
    engine_tree: "Цифры нашло Jev-дерево", engine_loop: "Ответил Jev-цикл", engine_crew: "Ответили агенты",
  },
};
const LOCALES = { en: "en-GB", az: "az", ru: "ru-RU" };
let LANG = I18N[store.get("pa-lang")] ? store.get("pa-lang") : "en";
const tr = (key, vars = {}) => (I18N[LANG][key] ?? I18N.en[key]).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function tablesWord(n) {
  if (LANG === "ru") {
    const form = new Intl.PluralRules("ru").select(n);
    return `${n} ${form === "one" ? "таблица" : form === "few" ? "таблицы" : "таблиц"}`;
  }
  if (LANG === "az") return `${n} cədvəl`;
  return `${n} ${n === 1 ? "table" : "tables"}`;
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    el.title = tr(el.dataset.i18nTitle); el.setAttribute("aria-label", el.title);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = tr(el.dataset.i18nPlaceholder); });
  $("#lang-code").textContent = LANG.toUpperCase();
  document.querySelectorAll("#lang-menu [data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  renderSummary();
  renderChats();
  // A conversation that has not started yet greets in the new language.
  if (!STATE.history.length) { $("#feed").innerHTML = ""; greet(); }
}

$("#lang").addEventListener("click", (e) => { e.stopPropagation(); $("#lang-menu").classList.toggle("hide"); });
$("#lang-menu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lang]");
  if (!b) return;
  LANG = b.dataset.lang;
  store.set("pa-lang", LANG);
  $("#lang-menu").classList.add("hide");
  applyLang();
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#lang-menu")) $("#lang-menu").classList.add("hide");
});

/* ---------- the sidebar folds ---------- */
function setCollapsed(on) {
  $("#shell").classList.toggle("collapsed", on);
  store.set("pa-side-collapsed", on ? "1" : "0");
}
$("#toggle").addEventListener("click", () => setCollapsed(!$("#shell").classList.contains("collapsed")));
setCollapsed(store.get("pa-side-collapsed") === "1");

/* ---------- talking to the server ---------- */
/* A signed-out answer (the session expired) sends the page to the login form. */
const api = (p, opts) => fetch(p, opts).then(r => {
  if (r.status === 401) { location.href = "/login"; return new Promise(() => {}); }
  return r.ok ? r.json() : r.json().then(e => Promise.reject(e));
});
/* One conversation = one Langfuse session: a fresh id on load and on "New chat". */
const conversationId = () => (crypto.randomUUID ? crypto.randomUUID()
  : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""));

let STATE = { history: [], busy: false, session: conversationId(), overview: null, chats: [] };

/* ---------- saved chats in the sidebar ---------- */
function groupOf(iso) {
  const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((day(new Date()) - day(new Date(iso))) / 86400000);
  return days <= 0 ? "today" : days === 1 ? "yesterday" : days < 7 ? "week" : "earlier";
}
function renderChats() {
  const list = $("#chats");
  if (!STATE.chats.length) { list.innerHTML = `<p class="no-chats">${esc(tr("no_chats"))}</p>`; return; }
  let html = "", group = null;
  for (const c of STATE.chats) {
    const g = groupOf(c.updated_at);
    if (g !== group) { html += `<h4>${esc(tr(g))}</h4>`; group = g; }
    html += `<div class="chat-item${c.id === STATE.session ? " on" : ""}" data-chat="${esc(c.id)}" title="${esc(c.title)}">
      <span class="t">${esc(c.title)}</span>
      <button class="act" data-rename="${esc(c.id)}" title="${esc(tr("rename"))}" aria-label="${esc(tr("rename"))}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="act" data-delete="${esc(c.id)}" title="${esc(tr("delete"))}" aria-label="${esc(tr("delete"))}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>`;
  }
  list.innerHTML = html;
}
async function loadChats() {
  STATE.chats = (await api("/api/chats")).chats;
  renderChats();
}
/* A saved chat, the way it was answered; asking again continues it. */
async function openChat(id) {
  if (STATE.busy) return;
  const chat = await api("/api/chats/" + encodeURIComponent(id));
  STATE.session = chat.id;
  STATE.history = chat.messages.map(m => ({ role: m.role, content: m.content }));
  $("#feed").innerHTML = "";
  for (const m of chat.messages) {
    if (m.role === "user") bubble("me", `<p>${esc(m.content)}</p>`);
    else bubble("bot", render(m.answer || { type: "answer", text: m.content }));
  }
  renderChats();
  $("#q").focus();
}
$("#chats").addEventListener("click", async (e) => {
  const ren = e.target.closest("[data-rename]"), del = e.target.closest("[data-delete]");
  if (ren) {
    const chat = STATE.chats.find(c => c.id === ren.dataset.rename);
    const title = prompt(tr("rename_prompt"), chat ? chat.title : "");
    if (title && title.trim()) {
      await api("/api/chats/" + encodeURIComponent(ren.dataset.rename), {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }),
      });
      await loadChats();
    }
    return;
  }
  if (del) {
    if (!confirm(tr("delete_confirm"))) return;
    await api("/api/chats/" + encodeURIComponent(del.dataset.delete), { method: "DELETE" });
    if (del.dataset.delete === STATE.session) newChat();
    await loadChats();
    return;
  }
  const item = e.target.closest("[data-chat]");
  if (item && item.dataset.chat !== STATE.session) openChat(item.dataset.chat);
});

/* The line above the chat: how many tables there are and when they were last written. */
function renderSummary() {
  const d = STATE.overview;
  if (!d) { $("#summary").textContent = ""; return; }
  let text = tablesWord(d.totals.tables);
  if (d.updated_at) {
    const date = new Intl.DateTimeFormat(LOCALES[LANG], { dateStyle: "medium", timeStyle: "short" })
      .format(new Date(d.updated_at));
    text += " · " + tr("updated", { date });
  }
  $("#summary").textContent = text;
}
async function load() {
  STATE.overview = await api("/api/overview");
  renderSummary();
}

function bubble(who, html) {
  const div = document.createElement("div");
  div.className = "msg" + (who === "me" ? " me" : "");
  div.innerHTML = `<span class="who">${who === "me" ? esc(tr("me")) : "PA"}</span><div class="bubble">${html}</div>`;
  $("#feed").append(div);
  $("#feed").scrollTop = $("#feed").scrollHeight;
  return div;
}
function resultTable(d) {
  if (!d.columns || !d.columns.length || !d.rows.length) return "";
  const head = d.columns.map(c => `<th title="${esc(c)}">${esc(short(c, 22))}</th>`).join("");
  const body = d.rows.slice(0, 50).map(r =>
    `<tr>${r.map(v => `<td class="mono">${esc(short(v, 26))}</td>`).join("")}</tr>`).join("");
  const more = d.rows.length > 50 ? `<p class="hint">${esc(tr("first_rows", { n: d.rows.length }))}</p>` : "";
  return `<div class="res"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
}
function sqlBox(d) {
  if (!d.sql) return "";
  return `<details class="sqlbox"><summary>SQL${d.table ? " · " + esc(d.table) : ""}</summary><pre>${esc(d.sql)}</pre></details>`;
}
/* The chart is a file the sandbox drew; the page only shows it. */
function chartImg(d) {
  return d.chart ? `<img class="chart" src="${esc(d.chart)}" alt="chart" loading="lazy" onerror="this.remove()">` : "";
}
/* The answer text is Markdown written by the model. A safe subset is rendered —
   paragraphs, lists, tables, bold and inline code; everything is escaped first,
   so nothing the model writes becomes HTML of its own. */
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function markdown(text) {
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const isRule = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  const bullet = /^\s*[-*•]\s+/, numbered = /^\s*\d+[.)]\s+/, heading = /^\s*#{1,6}\s+/;
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (isRow(line) && i + 1 < lines.length && isRule(lines[i + 1])) {
      const head = cells(line);
      const body = [];
      for (i += 2; i < lines.length && isRow(lines[i]); i++) body.push(cells(lines[i]));
      out.push(`<div class="res"><table><thead><tr>${head.map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${body.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (bullet.test(line) || numbered.test(line)) {
      const marker = numbered.test(line) ? numbered : bullet, tag = marker === numbered ? "ol" : "ul";
      const items = [];
      for (; i < lines.length && marker.test(lines[i]); i++) items.push(`<li>${inlineMd(lines[i].replace(marker, ""))}</li>`);
      out.push(`<${tag}>${items.join("")}</${tag}>`);
      continue;
    }
    if (heading.test(line)) { out.push(`<p><strong>${inlineMd(line.replace(heading, ""))}</strong></p>`); i++; continue; }
    // A paragraph: this line, and the plain lines after it.
    const para = [inlineMd(lines[i++])];
    while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !bullet.test(lines[i])
           && !numbered.test(lines[i]) && !heading.test(lines[i])) para.push(inlineMd(lines[i++]));
    out.push(`<p>${para.join("<br>")}</p>`);
  }
  return out.join("");
}
function engineChip(d) {
  if (!d.engine) return "";
  const kind = { "jev-tree": "tree", "jev-loop": "loop" }[d.engine] || "crew";
  return `<span class="engine${kind === "crew" ? "" : " " + kind}">${esc(tr("engine_" + kind))}</span>`;
}
function render(d) {
  if (d.type === "error") return `<p class="err">${esc(d.text)}</p>` + sqlBox(d);
  return `<div class="md">${markdown(d.text)}</div>${chartImg(d)}${sqlBox(d)}${resultTable(d)}${engineChip(d)}`;
}

/* What the crew is doing while the user waits: each step ticked when it is done. */
const STEP_ICONS = {
  running: `<span class="spin"></span>`,
  done: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  failed: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
};
function renderSteps(steps) {
  const known = steps.filter(s => I18N.en["step_" + s.step] && STEP_ICONS[s.state]);
  return `<ul class="steps">${known.map(s =>
    `<li class="${s.state}"><span class="ico">${STEP_ICONS[s.state]}</span>${esc(tr("step_" + s.step))}</li>`).join("")}</ul>`;
}

/* One question to the crew. The server streams the steps, one JSON object per
   line, and the answer as the last line; onSteps gets every change of the steps. */
async function askCrew(body, onSteps) {
  const r = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/x-ndjson" },
    body: JSON.stringify(body),
  });
  if (r.status === 401) { location.href = "/login"; return new Promise(() => {}); }
  if (!r.ok) throw await r.json().catch(() => ({ detail: r.statusText }));
  if (!r.body || !(r.headers.get("content-type") || "").includes("ndjson")) return r.json();
  const reader = r.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    let end;
    while ((end = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, end).trim();
      buffer = buffer.slice(end + 1);
      if (!line) continue;
      const msg = JSON.parse(line);
      if (msg.type === "progress") onSteps(msg.steps);
      else if (msg.type === "result") return msg.result;
    }
    if (done) throw new Error(tr("stream_cut"));
  }
}

async function ask(text) {
  if (STATE.busy || !text.trim()) return;
  STATE.busy = true;
  $("#send").disabled = true;
  bubble("me", `<p>${esc(text)}</p>`);
  STATE.history.push({ role: "user", content: text });
  const wait = bubble("bot", renderSteps([{ step: "question", state: "running" }]));
  const showSteps = (steps) => {
    const feed = $("#feed"), atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
    wait.querySelector(".bubble").innerHTML = renderSteps(steps);
    if (atBottom) feed.scrollTop = feed.scrollHeight;
  };

  try {
    const d = await askCrew(
      { message: text, history: STATE.history.slice(-6), session_id: STATE.session }, showSteps);
    wait.querySelector(".bubble").innerHTML = render(d);
    if (d.text) STATE.history.push({ role: "assistant", content: d.text });
    loadChats().catch(() => {});
  } catch (e) {
    wait.querySelector(".bubble").innerHTML = `<p class="err">${esc(e.detail || e.message || e)}</p>`;
  } finally {
    STATE.busy = false;
    $("#send").disabled = false;
    $("#feed").scrollTop = $("#feed").scrollHeight;
  }
}

const box = $("#q");
box.addEventListener("input", () => { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; });
box.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = box.value.trim();
    box.value = ""; box.style.height = "auto";
    ask(text);
  }
});
$("#send").addEventListener("click", () => {
  const text = box.value.trim();
  box.value = ""; box.style.height = "auto";
  ask(text);
});

const greet = () => bubble("bot", `<p>${esc(tr("greeting"))}</p>`);
function newChat() {
  if (STATE.busy) return;
  STATE.session = conversationId();
  STATE.history = [];
  $("#feed").innerHTML = "";
  greet();
  renderChats();
  $("#q").focus();
}
$("#newchat").addEventListener("click", newChat);
$("#logout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" }).catch(() => {});
  location.href = "/login";
});
api("/api/me").then(d => { $("#me-name").textContent = d.user; $("#me-ava").textContent = initials(d.user); });

applyLang();   // greets as well: the conversation has not started
loadChats().catch(() => {});
load().catch(e => bubble("bot", `<p class="err">${esc(tr("load_failed"))} ${esc(e.detail || e.message || e)}</p>`));
</script>
</body>
</html>
